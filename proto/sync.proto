syntax = "proto3";

package syncd;

service SyncService {
  rpc AddItem (AddItemRequest) returns (Item);
  rpc ListItems (ListItemsRequest) returns (ListItemsResponse);
  rpc CompleteItem (CompleteItemRequest) returns (Item);
  rpc DeleteItem (DeleteItemRequest) returns (DeleteItemResponse);
}

message Item {
  string id = 1;
  string title = 2;
  bool done = 3;
  int64 created_at = 4;
}

message AddItemRequest { string title = 1; }
message ListItemsRequest {}
message ListItemsResponse { repeated Item items = 1; }
message CompleteItemRequest { string id = 1; }
message DeleteItemRequest { string id = 1; }
message DeleteItemResponse { bool success = 1; }